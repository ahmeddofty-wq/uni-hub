<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{initializeFirestore,doc,getDoc,setDoc,collection,getDocs,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C=window.FBCFG;
if(C&&C.apiKey&&C.projectId){
const app=initializeApp(C),au=getAuth(app),db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
/* المحتوى المنشور: كل عنصر في مستند لوحده (id = بالرقم، pos = بالترتيب). الطلبات والرسائل في مجموعات منفصلة */
const LISTS=[['S','summaries','id'],['MK','market','id'],['LF','lostfound','id'],['NEWS','news','pos'],['CLUB','clubs','pos'],['ACT','activities','pos']],PEND=['requests','messages','mrequests','lrequests','crequests','trequests','jrequests','jdec'];
const last=new Map(),pad=n=>String(n).padStart(4,'0');let tm=0,busy=false,again=false,unsubs=[],loaded=false;
const wantMap=st=>{const w=new Map(),{logo,fav,hero,...cf}=st.CFG;
 w.set('site/config',JSON.stringify({CFG:cf,OV:st.OV,LINKS:st.LINKS,FAQ:st.FAQ,RULES:st.RULES,SUBL:st.SUBL,FAC:st.FAC,CP:st.CP,MKC:st.MKC,GR:st.GR,TR:st.TR,LABS:st.LABS}));
 if(logo||fav||hero||last.has('site/look'))w.set('site/look',JSON.stringify({logo:logo||'',fav:fav||'',hero:hero||''}));
 for(const[n,col,kind]of LISTS)(st[n]||[]).forEach((o,i)=>{let k=kind=='id'&&o.id!=null?'i'+o.id:pad(i);while(w.has(col+'/'+k))k+='_';w.set(col+'/'+k,JSON.stringify(o))});
 return w};
async function flush(){if(busy){again=true;return}busy=true;
 try{const w=wantMap(STATE()),jobs=[];
  for(const[p,j]of w)if(last.get(p)!==j)jobs.push([p,j]);
  for(const p of[...last.keys()])if(!w.has(p))jobs.push([p,null]);
  let bad=0;
  for(let i=0;i<jobs.length;i+=8)await Promise.all(jobs.slice(i,i+8).map(async([p,j])=>{try{const r=doc(db,...p.split('/'));if(j===null){await deleteDoc(r);last.delete(p)}else{await setDoc(r,{j,t:Date.now()});last.set(p,j)}}catch(e){bad++;console.error(p,e)}}));
  if(bad)toast('⚠ فشل حفظ '+bad+' عنصر في السحابة (لو فيه صور كبيرة قلل حجمها)');else if(jobs.length){FB.inited=true;FB.saved=Date.now()}
 }finally{busy=false;if(again){again=false;flush()}}}
async function loadAll(){
 const c=await getDoc(doc(db,'site','config'));if(!c.exists())return null;
 const d=JSON.parse(c.data().j);last.set('site/config',c.data().j);
 const l=await getDoc(doc(db,'site','look'));if(l.exists()){last.set('site/look',l.data().j);d.CFG=Object.assign(d.CFG||{},JSON.parse(l.data().j))}
 await Promise.all(LISTS.map(async([n,col,kind])=>{const sn=await getDocs(collection(db,col)),a=[];
  sn.forEach(x=>{const j=x.data().j;try{a.push(JSON.parse(j));last.set(col+'/'+x.id,j)}catch(_){}});
  if(kind=='id')a.sort((p,q)=>((q.at||0)-(p.at||0))||((q.id||0)-(p.id||0)));d[n]=a}));
 return d}
Object.assign(FB,{on:true,login:(e,p)=>signInWithEmailAndPassword(au,e,p),logout:()=>signOut(au),
 add:(c,o)=>setDoc(doc(db,c,o.cid),JSON.parse(JSON.stringify(o))).catch(e=>{console.error(e);toast('تعذر الإرسال، حاول تاني')}),
 get:async c=>(await getDocs(collection(db,c))).docs.map(x=>x.data()),
  del:(c,id)=>deleteDoc(doc(db,c,id)).catch(e=>console.error(e)),

(async()=>{try{const d=await loadAll();if(d){applyState(d);FB.inited=true}loaded=true}catch(e){console.error(e);FB.loadFailed=true}afterCloud()})();
}
